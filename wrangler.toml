name = "space-age-hustle-backend"
main = "src/workers/telegram.ts"
compatibility_date = "2026-08-22"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "space-age-hustle-db"
database_id = "space-age-hustle-db-prod"

[[kv_namespaces]]
binding = "STORY_KV"
id = "space-age-hustle-story-kv"

[ai]
binding = "AI"
